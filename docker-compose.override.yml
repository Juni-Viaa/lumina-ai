name: lumina-redesign

services:
  postgres:
    container_name: lumina-redesign-postgres
  redis:
    container_name: lumina-redesign-redis
  backend:
    container_name: lumina-redesign-backend
  celery:
    container_name: lumina-redesign-celery
    command: celery -A lumina worker --loglevel=info --concurrency=1 --prefetch-multiplier=1
    environment:
      RUN_WARMUP: '0'
      EMBEDDING_BATCH_SIZE: '2'
  celery-beat:
    container_name: lumina-redesign-celery-beat
  frontend:
    container_name: lumina-redesign-frontend
