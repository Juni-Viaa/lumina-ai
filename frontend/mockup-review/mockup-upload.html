<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lumina — Mockup Upload & Manage (Glassmorphism Blue & White)</title>
<style>
  :root {
    --bg-sky-50: #EAF4FF; --bg-sky-200: #BFD9F5; --bg-sky-400: #7CB1E5;
    --blue-50: #F0F7FF; --blue-600: #1E5FBF; --blue-700: #0F3F95;
    --ink-900: #0A2540; --ink-700: #23456B; --ink-500: #5A7592;
    --white: #FFFFFF; --accent-cyan: #52B6FF;
    --success: #18B487; --warning: #E6A93B; --danger: #E2506A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: "Space Grotesk", system-ui, sans-serif; color: var(--ink-900);
    background:
      radial-gradient(55% 45% at 10% 12%, rgba(82,182,255,0.42) 0%, rgba(82,182,255,0) 60%),
      radial-gradient(45% 40% at 92% 88%, rgba(124,177,229,0.5) 0%, rgba(124,177,229,0) 65%),
      linear-gradient(180deg, var(--bg-sky-50) 0%, var(--bg-sky-200) 55%, var(--bg-sky-400) 100%);
    background-attachment: fixed;
  }
  .orb { position: fixed; border-radius: 9999px; filter: blur(80px); opacity: 0.55; z-index: 0; pointer-events: none; }
  .orb-a { width: 360px; height: 360px; background: #A6D2FF; top: -100px; left: -60px; }
  .orb-b { width: 420px; height: 420px; background: #6FA8E6; bottom: -120px; right: -80px; }

  .glass-floating { background: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.65); box-shadow: inset 0 1px 0 rgba(255,255,255,0.85), 0 16px 40px -8px rgba(15,63,149,0.18); backdrop-filter: blur(28px) saturate(140%); -webkit-backdrop-filter: blur(28px) saturate(140%); border-radius: 24px; }
  .glass-card { background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.6); box-shadow: inset 0 1px 0 rgba(255,255,255,0.7), 0 8px 24px -6px rgba(15,63,149,0.14); backdrop-filter: blur(20px) saturate(135%); -webkit-backdrop-filter: blur(20px) saturate(135%); border-radius: 20px; }
  .glass-input { background: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.6); box-shadow: inset 0 1px 0 rgba(255,255,255,0.85), 0 2px 6px rgba(15,63,149,0.06); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 18px; }
  .glass-button { background: linear-gradient(180deg, #2C6FE0 0%, #0F3F95 100%); border: 1px solid rgba(255,255,255,0.25); box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 8px 20px -6px rgba(30,95,191,0.55); color: var(--white); border-radius: 14px; cursor: pointer; }
  .glass-pill { background: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.6); box-shadow: inset 0 1px 0 rgba(255,255,255,0.8); backdrop-filter: blur(10px); border-radius: 999px; }

  .app { position: relative; z-index: 1; height: 100vh; display: grid; grid-template-columns: 248px 1fr; gap: 14px; padding: 14px; }
  .sidebar { padding: 16px 12px; display: flex; flex-direction: column; gap: 6px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 8px 10px; margin-bottom: 12px; }
  .brand-mark { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, #2C6FE0 0%, #52B6FF 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.4); }
  .brand-name { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; color: var(--ink-700); font-size: 14px; cursor: pointer; }
  .nav-item:hover { background: rgba(255,255,255,0.5); }
  .nav-item.active { background: rgba(255,255,255,0.75); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 4px 10px -4px rgba(15,63,149,0.18); }
  .nav-item .icon { width: 18px; height: 18px; color: var(--blue-600); }
  .nav-section-title { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-500); padding: 14px 12px 4px; }
  .history-item { padding: 8px 12px 8px 40px; font-size: 13px; color: var(--ink-700); border-radius: 8px; }
  .sidebar-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid rgba(15,63,149,0.08); }

  .main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; }
  .topbar-title { font-size: 16px; font-weight: 600; }
  .topbar-meta { font-size: 12px; color: var(--ink-500); margin-top: 2px; }
  .profile { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--blue-600); }

  /* Upload panel */
  .panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .panel-head { padding: 18px 22px; border-bottom: 1px solid rgba(15,63,149,0.06); display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .panel-head h1 { font-size: 18px; font-weight: 600; margin: 0; }
  .segmented { display: inline-flex; padding: 4px; gap: 2px; }
  .segmented button { padding: 8px 16px; font-size: 13px; font-weight: 500; color: var(--ink-700); background: transparent; border: 0; cursor: pointer; border-radius: 12px; }
  .segmented button.active { background: rgba(255,255,255,0.85); color: var(--ink-900); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 2px 6px -2px rgba(15,63,149,0.18); }

  .panel-body { flex: 1; padding: 22px; overflow-y: auto; }

  /* Dropzone */
  .dropzone {
    height: 100%; min-height: 320px; border-radius: 24px; border: 2px dashed rgba(30,95,191,0.35);
    background: rgba(255,255,255,0.35); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    transition: border-color 200ms, background 200ms;
  }
  .dropzone:hover { border-color: var(--accent-cyan); background: rgba(255,255,255,0.5); }
  .drop-icon { width: 64px; height: 64px; border-radius: 20px; background: linear-gradient(135deg, rgba(30,95,191,0.18), rgba(82,182,255,0.18)); display: grid; place-items: center; color: var(--blue-600); }
  .drop-icon svg { width: 28px; height: 28px; }
  .dropzone h2 { font-size: 17px; font-weight: 600; margin: 0; }
  .dropzone p { font-size: 13px; color: var(--ink-500); margin: 0; }

  /* Document list */
  .doc-row { display: flex; align-items: center; gap: 14px; padding: 14px 18px; transition: background 150ms; }
  .doc-row:hover { background: rgba(255,255,255,0.45); }
  .doc-row + .doc-row { border-top: 1px solid rgba(15,63,149,0.06); }
  .doc-icon { width: 44px; height: 44px; border-radius: 14px; background: linear-gradient(135deg, rgba(30,95,191,0.18), rgba(82,182,255,0.18)); display: grid; place-items: center; color: var(--blue-600); flex-shrink: 0; }
  .doc-icon svg { width: 22px; height: 22px; }
  .doc-info { flex: 1; min-width: 0; }
  .doc-info .name { font-size: 14px; font-weight: 500; color: var(--ink-900); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .doc-info .meta { font-size: 12px; color: var(--ink-500); margin-top: 2px; display: flex; align-items: center; gap: 6px; }
  .status-pill { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.05em; }
  .status-pill.indexed { background: rgba(24,180,135,0.15); color: var(--success); }
  .status-pill.processing { background: rgba(230,169,59,0.18); color: #B47C16; }
  .status-pill.failed { background: rgba(226,80,106,0.15); color: var(--danger); }
  .doc-actions { display: flex; gap: 4px; }
  .doc-actions button { font-size: 12px; padding: 6px 12px; border-radius: 10px; background: transparent; border: 0; cursor: pointer; color: var(--ink-700); }
  .doc-actions button:hover { background: rgba(255,255,255,0.6); }
  .doc-actions .danger { color: var(--danger); }
  .doc-actions .warn { color: #B47C16; }
  .doc-actions .info { color: var(--blue-600); }

  /* Ingest split */
  .split { display: grid; grid-template-columns: 1fr 1.4fr; gap: 0; height: 100%; min-height: 360px; }
  .split > div { padding: 18px; overflow-y: auto; }
  .split > div + div { border-left: 1px solid rgba(15,63,149,0.06); }
  .ingest-doc { padding: 12px 14px; border-radius: 14px; margin-bottom: 6px; cursor: pointer; transition: background 150ms; }
  .ingest-doc:hover { background: rgba(255,255,255,0.4); }
  .ingest-doc.active { background: rgba(255,255,255,0.7); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9); }
  .ingest-doc .name { font-size: 13px; font-weight: 500; }
  .ingest-doc .meta { font-size: 11px; color: var(--ink-500); margin-top: 2px; }
  .timeline { display: flex; flex-direction: column; gap: 10px; }
  .timeline-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(15,63,149,0.06); }
  .timeline-item:last-child { border-bottom: 0; }
  .timeline-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--blue-600); margin-top: 6px; flex-shrink: 0; box-shadow: 0 0 0 4px rgba(30,95,191,0.15); }
  .timeline-item .step { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-500); font-weight: 600; }
  .timeline-item .msg { font-size: 13px; color: var(--ink-900); margin-top: 2px; }
  .timeline-item .ts { font-size: 10px; color: var(--ink-500); margin-top: 4px; }

  .label-section { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-500); margin: 0 0 12px; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(15,63,149,0.2); border-radius: 4px; }
</style>
</head>
<body>
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>

  <div class="app">
    <aside class="sidebar glass-floating">
      <div class="brand"><div class="brand-mark"></div><span class="brand-name">Lumina</span></div>
      <div class="nav-item"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>Chat Baru</div>
      <div class="nav-item active"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" /></svg>Upload &amp; Manage</div>
      <div class="nav-section-title">Riwayat</div>
      <div class="history-item">Apa itu RAG?</div>
      <div class="history-item">Soal Bloom C4</div>
      <div class="history-item">Ringkasan modul 3</div>
      <div class="sidebar-foot"><div class="nav-item">Logout</div></div>
    </aside>

    <div class="main">
      <header class="topbar glass-floating">
        <div>
          <div class="topbar-title">Admin · Aulia</div>
          <div class="topbar-meta">Upload &amp; Manage · 5 dokumen</div>
        </div>
        <div class="profile glass-card">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" /></svg>
        </div>
      </header>

      <section class="panel glass-floating">
        <div class="panel-head">
          <h1>Upload &amp; Manage</h1>
          <div class="segmented glass-input">
            <button class="active">Upload</button>
            <button>Dokumen</button>
            <button>Ingesting</button>
          </div>
        </div>

        <div class="panel-body">
          <div class="dropzone">
            <div class="drop-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="M12 16V8m0 0l-3 3m3-3 3 3" /><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2" /></svg>
            </div>
            <h2>Tarik &amp; lepas dokumen di sini</h2>
            <p>atau klik untuk memilih file · PDF, DOCX, TXT · maks 100 MB</p>
          </div>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
