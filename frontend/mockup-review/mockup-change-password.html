<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lumina — Mockup Change Password (Glassmorphism Blue & White)</title>
<style>
  :root {
    --bg-sky-50: #EAF4FF; --bg-sky-200: #BFD9F5; --bg-sky-400: #7CB1E5;
    --blue-600: #1E5FBF; --blue-700: #0F3F95; --ink-900: #0A2540; --ink-700: #23456B; --ink-500: #5A7592; --white: #FFFFFF; --accent-cyan: #52B6FF;
    --danger: #E2506A; --success: #18B487;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; }
  body { font-family:"Space Grotesk",system-ui,sans-serif; color:var(--ink-900); background:
    radial-gradient(55% 45% at 10% 12%, rgba(82,182,255,0.42) 0%, rgba(82,182,255,0) 60%),
    radial-gradient(45% 40% at 92% 88%, rgba(124,177,229,0.5) 0%, rgba(124,177,229,0) 65%),
    linear-gradient(180deg,var(--bg-sky-50) 0%,var(--bg-sky-200) 55%,var(--bg-sky-400) 100%);
    background-attachment:fixed; }
  .orb { position:fixed; border-radius:9999px; filter:blur(80px); opacity:0.55; z-index:0; pointer-events:none; }
  .orb-a { width:360px;height:360px;background:#A6D2FF;top:-100px;left:-60px; }
  .orb-b { width:420px;height:420px;background:#6FA8E6;bottom:-120px;right:-80px; }
  .glass-floating { background:rgba(255,255,255,0.55);border:1px solid rgba(255,255,255,0.65);box-shadow:inset 0 1px 0 rgba(255,255,255,0.85),0 16px 40px -8px rgba(15,63,149,0.18);backdrop-filter:blur(28px) saturate(140%);-webkit-backdrop-filter:blur(28px) saturate(140%);border-radius:24px; }
  .glass-card { background:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.6);box-shadow:inset 0 1px 0 rgba(255,255,255,0.7),0 8px 24px -6px rgba(15,63,149,0.14);backdrop-filter:blur(20px) saturate(135%);-webkit-backdrop-filter:blur(20px) saturate(135%);border-radius:20px; }
  .glass-input { background:rgba(255,255,255,0.55);border:1px solid rgba(255,255,255,0.6);box-shadow:inset 0 1px 0 rgba(255,255,255,0.85),0 2px 6px rgba(15,63,149,0.06);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:18px; }
  .glass-button { background:linear-gradient(180deg,#2C6FE0 0%,#0F3F95 100%);border:1px solid rgba(255,255,255,0.25);box-shadow:inset 0 1px 0 rgba(255,255,255,0.3),0 8px 20px -6px rgba(30,95,191,0.55);color:var(--white);border-radius:14px;cursor:pointer; }
  .glass-button-ghost { background:rgba(255,255,255,0.45);border:1px solid rgba(255,255,255,0.55);color:var(--ink-700);border-radius:14px; }
  .glass-pill { background:rgba(255,255,255,0.55);border:1px solid rgba(255,255,255,0.6);box-shadow:inset 0 1px 0 rgba(255,255,255,0.8);backdrop-filter:blur(10px);border-radius:999px; }
  .app { position:relative;z-index:1;height:100vh;display:flex;align-items:center;justify-content:center;padding:24px; }
  .auth-card { width:100%;max-width:420px;overflow:hidden; }
  .auth-header { padding:18px 24px;color:var(--white);background:linear-gradient(135deg,#2C6FE0 0%,#0F3F95 100%);border-bottom:1px solid rgba(255,255,255,0.18);text-align:center;font-size:17px;font-weight:600; }
  .auth-body { padding:28px 24px; }
  .brand-circle { width:88px;height:88px;margin:-56px auto 18px;background:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.8);border-radius:24px;box-shadow:0 10px 24px -8px rgba(15,63,149,0.3);display:grid;place-items:center;backdrop-filter:blur(20px); }
  .brand-circle .logo { width:56px;height:36px;background:linear-gradient(135deg,#2C6FE0 0%,#52B6FF 100%);border-radius:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.4); }
  .field { margin-bottom:14px; }
  .field-label { display:block;font-size:11px;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink-500);margin:0 0 6px 4px; }
  .input-row { display:flex;align-items:center;gap:10px;padding:13px 16px;background:rgba(255,255,255,0.55);border:1px solid rgba(255,255,255,0.6);border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.85),0 2px 6px rgba(15,63,149,0.06); }
  .input-row input { flex:1;border:none;background:transparent;color:var(--ink-900);font:inherit;outline:none; }
  .input-row input::placeholder { color:var(--ink-500); }
  .input-row .icon { width:18px;height:18px;color:var(--ink-500); }
  .row-between { display:flex;justify-content:space-between;align-items:center;margin:8px 0 0; }
  .checkbox { display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-700);cursor:pointer; }
  .checkbox input { appearance:none;width:18px;height:18px;border-radius:6px;background:rgba(255,255,255,0.6);border:1px solid rgba(15,63,149,0.25);display:grid;place-items:center;flex-shrink:0; }
  .checkbox input:checked { background:var(--blue-600);border-color:var(--blue-600); }
  .checkbox input:checked::after { content:"";width:10px;height:10px;background:white;clip-path:polygon(14% 44%,0 60%,50% 100%,100% 16%,80% 0,43% 62%); }
  .link { color:var(--blue-600);font-weight:600;text-decoration:none; }
  .link:hover { text-decoration:underline; }
  .btn-primary { width:100%;padding:14px;font-size:14px;font-weight:600;cursor:pointer; }
  .auth-foot { text-align:center;font-size:13px;color:var(--ink-700);margin-top:16px; }
  .alert { background:rgba(226,80,106,0.12);border:1px solid rgba(226,80,106,0.4);color:#A4223A;padding:10px 14px;border-radius:12px;font-size:13px;margin-bottom:14px; }
</style>
</head>
<body>
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>

  <div class="app">
    <div class="auth-card glass-floating">
      <div class="auth-header">Ubah Kata Sandi</div>
      <div class="auth-body">
        <div class="brand-circle"><div class="logo"></div></div>
        <form onsubmit="event.preventDefault();">
          <div class="field">
            <label class="field-label" for="old">Password Lama</label>
            <div class="input-row">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" /></svg>
              <input id="old" type="password" placeholder="••••••••" />
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="new">Password Baru</label>
            <div class="input-row">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" /></svg>
              <input id="new" type="password" placeholder="Minimal 8 karakter" />
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="confirm">Konfirmasi Password</label>
            <div class="input-row">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 01-1.043 3.296 3.745 3.745 0 01-3.296 1.043A3.745 3.745 0 0112 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 01-3.296-1.043 3.745 3.745 0 01-1.043-3.296A3.745 3.745 0 013 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 011.043-3.296 3.746 3.746 0 013.296-1.043A3.746 3.746 0 0112 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 013.296 1.043 3.746 3.746 0 011.043 3.296A3.745 3.745 0 0121 12z" /></svg>
              <input id="confirm" type="password" placeholder="Ulangi password" />
            </div>
          </div>

          <div class="row-between">
            <div class="checkbox">
              <input type="checkbox" id="remember" />
              <label for="remember">Simpan perubahan</label>
            </div>
            <a href="#" class="link">Batal</a>
          </div>

          <button type="submit" class="glass-button btn-primary">Simpan</button>
        </form>

        <div class="auth-foot">Harap ingat kata sandi Anda.</div>
      </div>
    </div>
  </div>
</body>
</html>
